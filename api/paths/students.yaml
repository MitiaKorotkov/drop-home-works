post:
  operationId: createStudent
  summary: Добавить ученика
  description: Создаёт учётную запись ученика в указанном классе. Логин сохраняется в нижнем регистре.
  tags: [students]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/StudentCreate.yaml
  responses:
    '201':
      description: Ученик создан
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Student.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
      description: Некорректное тело запроса или класс не существует
    '401':
      $ref: ../components/responses/Unauthorized.yaml
      description: Вход не выполнен
    '403':
      $ref: ../components/responses/Forbidden.yaml
      description: Доступно только учителю
    '409':
      $ref: ../components/responses/Conflict.yaml
      description: Логин занят
