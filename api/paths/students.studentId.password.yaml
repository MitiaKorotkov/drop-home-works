parameters:
  - $ref: ../components/parameters/studentId.yaml

put:
  operationId: setStudentPassword
  summary: Задать новый пароль
  description: Задаёт ученику новый пароль и завершает все его сессии.
  tags: [students]
  requestBody:
    required: true
    description: Новый пароль
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetPassword.yaml
  responses:
    '204':
      description: Пароль изменён
    '400':
      $ref: ../components/responses/BadRequest.yaml
      description: Пароль не подходит по длине
    '401': 
      $ref: ../components/responses/Unauthorized.yaml
      description: Вход не выполнен
    '403':
      $ref: ../components/responses/Forbidden.yaml
      description: Доступно только учителю
    '404':
      $ref: ../components/responses/NotFound.yaml
      description: Ученик не найден
