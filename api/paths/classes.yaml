get:
  operationId: listClasses
  summary: Список классов
  tags: [classes]
  responses:
    '200':
      description: Список классов
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Class.yaml
    '401': 
      $ref: ../components/responses/Unauthorized.yaml
      description: Вход не выполнен
    '403':
      $ref: ../components/responses/Forbidden.yaml
      description: Доступно только учителю

post:
  operationId: createClass
  summary: Создать класс
  tags: [classes]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ClassCreate.yaml
  responses:
    '201':
      description: Класс создан
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Class.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
      description: Некорректное тело запроса
    '401': 
      $ref: ../components/responses/Unauthorized.yaml
      description: Вход не выполнен
    '403':
      $ref: ../components/responses/Forbidden.yaml
      description: Доступно только учителю
    '409':
      $ref: ../components/responses/Conflict.yaml
      description: Название занято
