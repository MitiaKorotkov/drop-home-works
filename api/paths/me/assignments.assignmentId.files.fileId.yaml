parameters:
  - $ref: ../../components/parameters/assignmentId.yaml
  - $ref: ../../components/parameters/fileId.yaml

get:
  operationId: downloadMyAssignmentFile
  summary: Скачать файл задания
  tags: [student]
  responses:
    '200':
      description: Файл задания
      headers:
        Content-Disposition:
          $ref: ../../components/headers/ContentDisposition.yaml
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
      description: Вход не выполнен
    '403':
      $ref: ../../components/responses/Forbidden.yaml
      description: Доступно только ученикам
    '404':
      $ref: ../../components/responses/NotFound.yaml
      description: Задание или файл не найдены
