parameters:
  - $ref: ../components/parameters/assignmentId.yaml
  - $ref: ../components/parameters/studentId.yaml

get:
  operationId: downloadSubmission
  summary: Скачать работу ученика
  tags: [review]
  responses:
    '200':
      description: Присланный PDF
      headers:
        Content-Disposition:
          $ref: ../components/headers/ContentDisposition.yaml
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    '401':
      $ref: ../components/responses/Unauthorized.yaml
      description: Вход не выполнен
    '403':
      $ref: ../components/responses/Forbidden.yaml
      description: Доступно только учителю
    '404':
      $ref: ../components/responses/NotFound.yaml
      description: Задание не найдено или ученик не сдал работу