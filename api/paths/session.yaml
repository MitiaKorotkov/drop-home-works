get:
  operationId: getSession
  summary: Узнать, кто я
  tags: [auth]
  responses:
    '200':
      description: Текущий пользователь
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Me.yaml'
    '401':
      $ref: ../components/responses/Unauthorized.yaml
      description: Вход не выполнен

post:
  operationId: login
  summary: Войти
  tags: [auth]
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/LoginRequest.yaml'
  responses:
    '200':
      description: Текущий пользователь
      headers:
        Set-Cookie:
          $ref: '../components/headers/SessionCookie.yaml'
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Me.yaml'
    '400':
      $ref: ../components/responses/BadRequest.yaml
      description: Некорректное тело запроса
    '401':
      $ref: ../components/responses/Unauthorized.yaml
      description: Неверный логин или пароль
    '403':
      $ref: ../components/responses/Forbidden.yaml
      description: Запрос с чужого сайта отклонён
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
      description: Слишком много попыток входа

delete:
  operationId: logout
  summary: Выйти
  tags: [auth]
  security: []
  responses:
    '204':
      description: Сессия завершена
      headers:
        Set-Cookie:
          $ref: '../components/headers/SessionCookie.yaml'
    '403':
      $ref: ../components/responses/Forbidden.yaml
      description: Запрос с чужого сайта отклонён
