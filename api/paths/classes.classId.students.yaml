parameters:
  - $ref: ../components/parameters/classId.yaml

get:
  operationId: listClassStudents
  summary: Ученики класса
  tags: [classes]
  responses:
    '200':
      description: Список учеников, отсортированный по фамилии и имени
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Student.yaml
    '401': 
      $ref: ../components/responses/Unauthorized.yaml
      description: Вход не выполнен
    '403':
      $ref: ../components/responses/Forbidden.yaml
      description: Доступно только учителю
    '404':
      $ref: ../components/responses/NotFound.yaml
      description: Класс не найден
