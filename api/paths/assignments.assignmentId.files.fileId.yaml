parameters:
  - $ref: ../components/parameters/assignmentId.yaml
  - $ref: ../components/parameters/fileId.yaml

get:
  operationId: downloadAssignmentFile
  summary: Скачать файл задания
  tags: [assignments]
  responses:
    '200':
      description: Файл задания
      headers:
        Content-Disposition:
          $ref: ../components/headers/ContentDisposition.yaml
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '401':
      description: Вход не выполнен
    '403':
      description: Доступно только учителю
    '404':
      description: Задание или файл не найдены

delete:
  operationId: deleteAssignmentFile
  summary: Удалить файл задания
  tags: [assignments]
  responses:
    '204':
      description: Файл удалён
    '401':
      description: Вход не выполнен
    '403':
      description: Доступно только учителю
    '404':
      description: Задание или файл не найдены
